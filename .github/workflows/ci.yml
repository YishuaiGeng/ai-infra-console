name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check web
        shell: bash
        run: |
          set +e
          npm run check:web 2>&1 | tee web-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Web check failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 web-check.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 web-check.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.9.18
      - run: uv sync --project apps/api --all-groups --frozen
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api mypy --config-file apps/api/pyproject.toml apps/api/src apps/api/tests
      - run: uv run --project apps/api pytest apps/api/tests

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.9.18
      - run: uv sync --project apps/agent --all-groups --frozen
      - run: uv run --project apps/agent ruff check apps/agent
      - run: uv run --project apps/agent mypy --config-file apps/agent/pyproject.toml apps/agent/src apps/agent/tests
      - run: uv run --project apps/agent pytest apps/agent/tests
      - run: uv build --project apps/agent
      - run: bash -n scripts/install-agent.sh
      - run: python scripts/security_scan.py

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate temporary runtime secrets
        run: |
          echo "AI_INFRA_ENVIRONMENT=production" >> "$GITHUB_ENV"
          echo "AI_INFRA_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AI_INFRA_BOOTSTRAP_ADMIN_USERNAME=ci-admin" >> "$GITHUB_ENV"
          echo "AI_INFRA_BOOTSTRAP_ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "AI_INFRA_POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "AI_INFRA_WEB_PORT=3100" >> "$GITHUB_ENV"
          echo "AI_INFRA_API_PORT=8100" >> "$GITHUB_ENV"
          echo 'AI_INFRA_MUTABLE_SERVER_NAMES=["ci-agent"]' >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        shell: bash
        run: |
          set +e
          docker compose --profile agent build agent 2>&1 | tee agent-build.log
          agent_status=${PIPESTATUS[0]}
          if [ "$agent_status" -ne 0 ]; then
            echo "### Agent image build failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 agent-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$agent_status"
          fi
          docker compose build 2>&1 | tee compose-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Compose build failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 compose-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 50 compose-build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi
          docker compose up -d --wait --wait-timeout 180 2>&1 | tee compose-start.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Compose start failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 compose-start.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Verify migrations, Agent, infrastructure API, SSE, Web BFF, and services
        shell: bash
        run: |
          set +e
          python apps/api/scripts/compose_smoke.py 2>&1 | tee compose-smoke.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Compose verification failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 compose-smoke.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            failure_line=$(grep -F '[compose-smoke] failed:' compose-smoke.log | tail -n 1)
            if [ -n "$failure_line" ]; then
              echo "::error title=Compose smoke stage::$failure_line"
            else
              echo "::error title=Compose smoke failure::See the job summary for details."
            fi
          fi
          exit "$status"
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
