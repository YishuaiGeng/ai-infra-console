name: ai-infra-console

x-api-environment: &api-environment
  AI_INFRA_ENVIRONMENT: ${AI_INFRA_ENVIRONMENT:-development}
  AI_INFRA_DATABASE_URL: postgresql+asyncpg://ai_infra:${AI_INFRA_POSTGRES_PASSWORD:?Set AI_INFRA_POSTGRES_PASSWORD in .env}@postgres:5432/ai_infra
  AI_INFRA_REDIS_URL: redis://redis:6379/0
  AI_INFRA_JWT_SECRET: ${AI_INFRA_JWT_SECRET:?Set AI_INFRA_JWT_SECRET in .env}
  AI_INFRA_CREDENTIAL_ENCRYPTION_KEY: ${AI_INFRA_CREDENTIAL_ENCRYPTION_KEY:?Set AI_INFRA_CREDENTIAL_ENCRYPTION_KEY in .env}
  AI_INFRA_CREDENTIAL_ENCRYPTION_KEY_VERSION: ${AI_INFRA_CREDENTIAL_ENCRYPTION_KEY_VERSION:-v1}
  AI_INFRA_BOOTSTRAP_ADMIN_USERNAME: ${AI_INFRA_BOOTSTRAP_ADMIN_USERNAME:-admin}
  AI_INFRA_BOOTSTRAP_ADMIN_PASSWORD: ${AI_INFRA_BOOTSTRAP_ADMIN_PASSWORD:-}
  AI_INFRA_ACCESS_TOKEN_MINUTES: ${AI_INFRA_ACCESS_TOKEN_MINUTES:-30}
  AI_INFRA_AGENT_OFFLINE_SECONDS: ${AI_INFRA_AGENT_OFFLINE_SECONDS:-30}
  AI_INFRA_LOG_LEVEL: ${AI_INFRA_LOG_LEVEL:-INFO}
  AI_INFRA_EXTERNAL_API_ALLOW_PRIVATE_NETWORKS: ${AI_INFRA_EXTERNAL_API_ALLOW_PRIVATE_NETWORKS:-false}
  AI_INFRA_EXTERNAL_API_ALLOWED_HOSTS: ${AI_INFRA_EXTERNAL_API_ALLOWED_HOSTS:-[]}
  AI_INFRA_EXTERNAL_API_ALLOWED_CIDRS: ${AI_INFRA_EXTERNAL_API_ALLOWED_CIDRS:-[]}
  AI_INFRA_API_RESOURCE_REQUEST_TIMEOUT_SECONDS: ${AI_INFRA_API_RESOURCE_REQUEST_TIMEOUT_SECONDS:-15}
  AI_INFRA_API_RESOURCE_MAX_RESPONSE_BYTES: ${AI_INFRA_API_RESOURCE_MAX_RESPONSE_BYTES:-2097152}
  AI_INFRA_MUTABLE_SERVER_NAMES: ${AI_INFRA_MUTABLE_SERVER_NAMES:-[]}
  AI_INFRA_MODEL_TASK_LEASE_SECONDS: ${AI_INFRA_MODEL_TASK_LEASE_SECONDS:-60}
  AI_INFRA_DEPLOYMENT_TASK_LEASE_SECONDS: ${AI_INFRA_DEPLOYMENT_TASK_LEASE_SECONDS:-90}
  AI_INFRA_DEPLOYMENT_TELEMETRY_FRESH_SECONDS: ${AI_INFRA_DEPLOYMENT_TELEMETRY_FRESH_SECONDS:-30}
  AI_INFRA_DEPLOYMENT_LOG_RETENTION_LINES: ${AI_INFRA_DEPLOYMENT_LOG_RETENTION_LINES:-2000}
  AI_INFRA_VLLM_IMAGE: ${AI_INFRA_VLLM_IMAGE:-vllm/vllm-openai:latest}
  AI_INFRA_MODEL_CATALOG_TIMEOUT_SECONDS: ${AI_INFRA_MODEL_CATALOG_TIMEOUT_SECONDS:-10}
  AI_INFRA_MODEL_CATALOG_CACHE_SECONDS: ${AI_INFRA_MODEL_CATALOG_CACHE_SECONDS:-60}
  AI_INFRA_HF_TOKEN: ${AI_INFRA_HF_TOKEN:-}
  AI_INFRA_HF_ENDPOINT: ${AI_INFRA_HF_ENDPOINT:-https://huggingface.co}
  AI_INFRA_MODELSCOPE_TOKEN: ${AI_INFRA_MODELSCOPE_TOKEN:-}
  AI_INFRA_MODELSCOPE_ENDPOINT: ${AI_INFRA_MODELSCOPE_ENDPOINT:-https://modelscope.cn}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_infra
      POSTGRES_USER: ai_infra
      POSTGRES_PASSWORD: ${AI_INFRA_POSTGRES_PASSWORD:?Set AI_INFRA_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_infra -d ai_infra"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && ai-infra-bootstrap && ai-infra-api"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AI_INFRA_API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - frontend
      - backend

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["ai-infra-worker"]
    environment: *api-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from redis import Redis; from rq import Worker; connection=Redis.from_url('redis://redis:6379/0'); assert Worker.all(connection=connection)",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - backend

  agent:
    profiles: ["agent"]
    image: ai-infra-console-agent:latest
    hostname: ai-infra-agent
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    environment:
      AI_INFRA_AGENT_ENVIRONMENT: development
      AI_INFRA_AGENT_CENTRAL_URL: http://api:8000
      AI_INFRA_AGENT_TOKEN: ${AI_INFRA_AGENT_TOKEN:-}
      AI_INFRA_AGENT_HEARTBEAT_SECONDS: 1
      AI_INFRA_AGENT_TLS_VERIFY: "true"
      AI_INFRA_AGENT_ALLOWED_MODEL_DIRECTORIES: '["/models","/downloads"]'
      AI_INFRA_AGENT_DEFAULT_MODEL_DIRECTORY: /downloads
      AI_INFRA_AGENT_MODEL_SCAN_INTERVAL_SECONDS: 10
      AI_INFRA_AGENT_ENABLE_MODEL_MUTATIONS: "true"
      AI_INFRA_AGENT_MODEL_TASK_PROGRESS_SECONDS: 0.25
      AI_INFRA_AGENT_MODEL_DOWNLOAD_FIXTURE_SOURCE: /provider-fixtures
      AI_INFRA_AGENT_ENABLE_DEPLOYMENTS: "true"
      AI_INFRA_AGENT_VLLM_IMAGE: ${AI_INFRA_VLLM_IMAGE:-vllm/vllm-openai:latest}
      AI_INFRA_AGENT_DEPLOYMENT_OPERATION_PROGRESS_SECONDS: 0.5
      AI_INFRA_AGENT_DEPLOYMENT_RECONCILE_SECONDS: 1
      AI_INFRA_AGENT_DEPLOYMENT_RUNTIME_FIXTURE: "true"
      AI_INFRA_AGENT_DEPLOYMENT_GPU_FIXTURE: "true"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    volumes:
      - ./apps/agent/tests/fixtures/models:/models:ro
      - ./apps/agent/tests/fixtures/provider:/provider-fixtures:ro
    tmpfs:
      - /tmp:uid=1002,gid=1002,mode=0750
      - /downloads:uid=1002,gid=1002,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AI_INFRA_API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${AI_INFRA_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/dashboard",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - frontend
      - backend

volumes:
  postgres-data:
  redis-data:

networks:
  frontend:
  backend:
    internal: true
