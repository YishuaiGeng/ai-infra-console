[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-infra-console-agent"
version = "0.1.0"
description = "Outbound hardware agent for AI Infra Console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "docker>=7.1,<8",
  "httpx>=0.28,<1",
  "nvidia-ml-py>=12.560,<14",
  "psutil>=6.1,<8",
  "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-docker>=7.1,<8",
  "types-psutil>=7.0,<8",
]

[project.scripts]
ai-infra-agent = "ai_infra_agent.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_infra_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=ai_infra_agent --cov-report=term-missing"
